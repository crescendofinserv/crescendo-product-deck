<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crescendo Finserv — Confidential Presentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #0a0f0e;
    --card-bg: #121918;
    --card-border: rgba(169, 128, 63, 0.32);
    --gold: #c5a059;
    --gold-light: #dfbe7d;
    --gold-glow: rgba(197, 160, 89, 0.2);
    --text-white: #f5f4ef;
    --text-muted: #8e9b97;
    --text-dim: #5c6864;
    --crimson: #d9534f;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background: radial-gradient(circle at 50% 20%, #152320 0%, #0a0f0e 65%, #050807 100%);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text-white);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: 
      linear-gradient(rgba(197, 160, 89, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(197, 160, 89, 0.035) 1px, transparent 1px);
    background-size: 38px 38px;
    pointer-events: none;
  }

  .auth-card {
    position: relative;
    background: linear-gradient(150deg, #15201e 0%, #0e1413 100%);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 44px 40px 36px;
    width: 100%;
    max-width: 470px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), 0 0 45px var(--gold-glow);
    text-align: center;
    backdrop-filter: blur(10px);
    z-index: 10;
  }

  .crest-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(197, 160, 89, 0.22) 0%, rgba(197, 160, 89, 0.04) 75%);
    border: 1px solid var(--gold);
    color: var(--gold-light);
    margin-bottom: 22px;
    box-shadow: 0 0 24px rgba(197, 160, 89, 0.3);
  }

  .crest-icon svg {
    width: 28px;
    height: 28px;
    fill: currentColor;
  }

  .brand-tag {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.24em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .deck-title {
    font-size: 23px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: -0.01em;
    margin-bottom: 10px;
  }

  .deck-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 26px;
  }

  .security-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold-light);
    background: rgba(197, 160, 89, 0.1);
    border: 1px solid rgba(197, 160, 89, 0.28);
    padding: 6px 14px;
    border-radius: 20px;
    margin-bottom: 24px;
    font-family: 'JetBrains Mono', monospace;
  }

  .input-group {
    position: relative;
    margin-bottom: 20px;
    text-align: left;
  }

  .input-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .password-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .password-input {
    width: 100%;
    background: rgba(6, 9, 8, 0.85);
    border: 1px solid rgba(197, 160, 89, 0.38);
    border-radius: 8px;
    padding: 13px 44px 13px 16px;
    font-size: 15px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #ffffff;
    transition: all 0.2s ease;
    outline: none;
  }

  .password-input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.25);
    background: rgba(10, 15, 14, 0.95);
  }

  .toggle-visibility {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s ease;
  }

  .toggle-visibility:hover {
    color: var(--gold-light);
  }

  .unlock-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--gold) 0%, #9e7a35 100%);
    border: 1px solid var(--gold-light);
    border-radius: 8px;
    padding: 14px 20px;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #0c1110;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(197, 160, 89, 0.32);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .unlock-btn:hover {
    background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
    box-shadow: 0 6px 24px rgba(197, 160, 89, 0.48);
    transform: translateY(-1px);
  }

  .unlock-btn:active {
    transform: translateY(0);
  }

  .error-msg {
    display: none;
    margin-top: 14px;
    padding: 10px 14px;
    background: rgba(217, 83, 79, 0.12);
    border: 1px solid rgba(217, 83, 79, 0.35);
    border-radius: 8px;
    font-size: 12.5px;
    color: #ff8580;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }

  .error-msg.visible {
    display: flex;
    animation: shake 0.35s ease-in-out;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }

  .footer-note {
    margin-top: 24px;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  .spinner {
    display: none;
    width: 18px;
    height: 18px;
    border: 2px solid rgba(13, 18, 17, 0.3);
    border-top-color: #0d1211;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div class="auth-card" id="authCard">
  <div class="crest-icon">
    <svg viewBox="0 0 24 24">
      <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
    </svg>
  </div>

  <div class="brand-tag">Crescendo Finserv</div>
  <div class="deck-title">Client Presentation</div>
  <div class="deck-subtitle">Authorized Client Portfolio &amp; Strategy Deck</div>

  <div class="security-badge">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
      <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
    </svg>
    AES-256 Encrypted &bull; October 2026
  </div>

  <form id="authForm" onsubmit="handleUnlock(event)">
    <div class="input-group">
      <label class="input-label" for="passwordInput">Client Access Password</label>
      <div class="password-wrapper">
        <input 
          type="password" 
          id="passwordInput" 
          class="password-input" 
          placeholder="Enter access password..." 
          required 
          autocomplete="current-password"
          autofocus
        />
        <button type="button" class="toggle-visibility" id="toggleBtn" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
          <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
    </div>

    <button type="submit" class="unlock-btn" id="unlockBtn">
      <span class="btn-text" id="btnText">Unlock Presentation</span>
      <div class="spinner" id="spinner"></div>
    </button>

    <div class="error-msg" id="errorMsg">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
      <span>Incorrect password. Access denied.</span>
    </div>
  </form>

  <div class="footer-note">
    Strictly Private &amp; Confidential &bull; For Intended Recipient Only
  </div>
</div>

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) {
      bytes[i] = bin.charCodeAt(i);
    }
    return bytes;
  }

  function togglePasswordVisibility() {
    const input = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('eyeIcon');
    if (input.type === 'password') {
      input.type = 'text';
      eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
    } else {
      input.type = 'password';
      eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    }
  }

  async function decryptDeck(password) {
    const cleanPwd = password.trim().toLowerCase();
    const saltBytes = b64ToBytes(PAYLOAD.salt);
    const ivBytes = b64ToBytes(PAYLOAD.iv);
    const ctBytes = b64ToBytes(PAYLOAD.ct);

    const encoder = new TextEncoder();
    const passwordKey = await crypto.subtle.importKey(
      "raw",
      encoder.encode(cleanPwd),
      { name: "PBKDF2" },
      false,
      ["deriveKey"]
    );

    const aesKey = await crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: saltBytes,
        iterations: 100000,
        hash: "SHA-256"
      },
      passwordKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );

    const decryptedBuffer = await crypto.subtle.decrypt(
      {
        name: "AES-GCM",
        iv: ivBytes
      },
      aesKey,
      ctBytes
    );

    return new TextDecoder().decode(decryptedBuffer);
  }

  async function handleUnlock(e) {
    if (e) e.preventDefault();
    const pwdInput = document.getElementById('passwordInput');
    const pwd = pwdInput.value;
    const errorEl = document.getElementById('errorMsg');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    const unlockBtn = document.getElementById('unlockBtn');

    if (!pwd) return;

    errorEl.classList.remove('visible');
    btnText.style.display = 'none';
    spinner.style.display = 'block';
    unlockBtn.disabled = true;

    try {
      const html = await decryptDeck(pwd);
      try {
        sessionStorage.setItem('crescendo_deck_auth', pwd.trim().toLowerCase());
      } catch (err) {}
      
      document.open();
      document.write(html);
      document.close();
    } catch (err) {
      console.error(err);
      errorEl.classList.add('visible');
      btnText.style.display = 'block';
      spinner.style.display = 'none';
      unlockBtn.disabled = false;
      pwdInput.focus();
      pwdInput.select();
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    try {
      const cached = sessionStorage.getItem('crescendo_deck_auth');
      if (cached) {
        document.getElementById('passwordInput').value = cached;
        handleUnlock();
      }
    } catch (err) {}
  });
